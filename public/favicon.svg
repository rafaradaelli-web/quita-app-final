<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2D1458"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="32" height="32" rx="8" fill="url(#bg)"/>
  <!-- Ears -->
  <ellipse cx="10" cy="7.5" rx="4" ry="3.5" fill="#F9A8C9" transform="rotate(-15 10 7.5)"/>
  <ellipse cx="22" cy="7.5" rx="4" ry="3.5" fill="#F9A8C9" transform="rotate(15 22 7.5)"/>
  <ellipse cx="10" cy="7.5" rx="2.5" ry="2" fill="#F472B6" transform="rotate(-15 10 7.5)"/>
  <ellipse cx="22" cy="7.5" rx="2.5" ry="2" fill="#F472B6" transform="rotate(15 22 7.5)"/>
  <!-- Face -->
  <circle cx="16" cy="17" r="10" fill="#FBB6CE"/>
  <!-- Eyes -->
  <circle cx="12.5" cy="15" r="1.8" fill="#1E0A3C"/>
  <circle cx="19.5" cy="15" r="1.8" fill="#1E0A3C"/>
  <!-- Eye shine -->
  <circle cx="13.2" cy="14.2" r="0.7" fill="white"/>
  <circle cx="20.2" cy="14.2" r="0.7" fill="white"/>
  <!-- Snout -->
  <ellipse cx="16" cy="20.5" rx="4.5" ry="3" fill="#F9A8C9"/>
  <!-- Nostrils -->
  <ellipse cx="14.2" cy="20.5" rx="1" ry="0.8" fill="#E879A0"/>
  <ellipse cx="17.8" cy="20.5" rx="1" ry="0.8" fill="#E879A0"/>
  <!-- Cheeks (blush) -->
  <circle cx="8.5" cy="19" r="2" fill="#F472B6" opacity="0.3"/>
  <circle cx="23.5" cy="19" r="2" fill="#F472B6" opacity="0.3"/>
</svg>
